apply plugin: 'com.android.library'
group = 'expo.modules.torrent'
version = '0.0.1'
apply from: new File(project(':expo-modules-core').projectDir, 'ExpoModulesCorePlugin.gradle')
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
android {
    namespace 'expo.modules.torrent'
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig { minSdkVersion 24 }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/torrserver')
    packagingOptions.jniLibs.keepDebugSymbols += ['**/libtorrserver.so']
}
def abis = (findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(',') as List
tasks.register('prepareTorrentEngine', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine(['node', 'scripts/prepare-torrent-engine.cjs'] + abis)
    inputs.file new File(rootProject.projectDir.parentFile, 'scripts/prepare-torrent-engine.cjs')
    outputs.files abis.collect { layout.buildDirectory.file("generated/torrserver/${it}/libtorrserver.so") }
}
tasks.named('preBuild').configure { dependsOn 'prepareTorrentEngine' }

tasks.register('torrentNotices', Copy) {
    from new File(rootProject.projectDir.parentFile, 'third-party/TorrServer')
    into layout.buildDirectory.dir('generated/torrentAssets/torrserver')
}
android.sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/torrentAssets')
tasks.named('preBuild').configure { dependsOn 'torrentNotices' }
